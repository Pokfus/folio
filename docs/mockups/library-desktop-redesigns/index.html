<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Folio Library Redesigns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: six alternative desktop pages for one shelf of 101 texts, sharing one state; a dark strip fixed
   to the bottom edge is the mockup's own switcher and is not part of any design. */
:root{
  --paper:#F7F6FB; --paper-2:#EBE9F5; --card:#FDFDFF; --ink:#1D1B29; --ink-soft:#514D68; --ink-quiet:#69657E;
  --ink-faint:#918CA8; --rule:#DEDAEE; --indigo:#45549C; --indigo-bright:#5263B0; --indigo-wash:#E9ECFA;
  --ochre:#9A7C55; --zh:#AE3350; --good:#4E9B7E;
  --bg-grad:linear-gradient(135deg,#F4F0FB 0%,#EAF3FB 22%,#EFF8F2 44%,#FBF3F7 68%,#F2EFFC 100%);
  --glass:rgba(247,246,251,.9); --lift:0 1px 2px rgba(29,27,41,.04),0 8px 24px rgba(29,27,41,.07);
  --pop:0 2px 6px rgba(29,27,41,.08),0 18px 44px rgba(29,27,41,.16);
  --bk-mix:100%; --bk-fill:100%;   /* how much of a book's own colour survives as text, and as a spine or a mark */
  --cover-edge:rgba(29,27,41,0); --cover-ink:#FFFFFF; --wash:7%;
  --chrome:#1D1B29; --chrome-2:#2C2940; --chrome-ink:#F3F1FC; --chrome-quiet:#ABA6C6; --chrome-rule:#3D395A;
  --chrome-on:#F3F1FC; --chrome-on-ink:#1D1B29;
  --f-sans:"Nunito Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Lora",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut:32px; --bar-h:58px; --top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#131220; --paper-2:#0C0B16; --card:#1C1A2C; --ink:#EFEDFA; --ink-soft:#B6B1D0; --ink-quiet:#9A95B6;
  --ink-faint:#827CA0; --rule:#302C48; --indigo:#A6B4F0; --indigo-bright:#C2CCFF; --indigo-wash:#20203A;
  --ochre:#C3A47A; --zh:#EFA8B8; --good:#75C6A4;
  --bg-grad:linear-gradient(135deg,#181630 0%,#101C2A 24%,#0F1F1E 48%,#23142A 72%,#14122A 100%);
  --glass:rgba(19,18,32,.9); --lift:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --pop:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5);
  --bk-mix:50%; --bk-fill:66%; --cover-edge:rgba(255,255,255,.16); --cover-ink:#FFFFFF; --wash:13%;
  --chrome:#2A2742; --chrome-2:#3A3658; --chrome-ink:#F3F1FC; --chrome-quiet:#B4AFD0; --chrome-rule:#4A4570;
  --chrome-on:#F3F1FC; --chrome-on-ink:#1D1B29; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#131220; --paper-2:#0C0B16; --card:#1C1A2C; --ink:#EFEDFA; --ink-soft:#B6B1D0; --ink-quiet:#9A95B6;
  --ink-faint:#827CA0; --rule:#302C48; --indigo:#A6B4F0; --indigo-bright:#C2CCFF; --indigo-wash:#20203A;
  --ochre:#C3A47A; --zh:#EFA8B8; --good:#75C6A4;
  --bg-grad:linear-gradient(135deg,#181630 0%,#101C2A 24%,#0F1F1E 48%,#23142A 72%,#14122A 100%);
  --glass:rgba(19,18,32,.9); --lift:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --pop:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5);
  --bk-mix:50%; --bk-fill:66%; --cover-edge:rgba(255,255,255,.16); --cover-ink:#FFFFFF; --wash:13%;
  --chrome:#2A2742; --chrome-2:#3A3658; --chrome-ink:#F3F1FC; --chrome-quiet:#B4AFD0; --chrome-rule:#4A4570;
  --chrome-on:#F3F1FC; --chrome-on-ink:#1D1B29; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 var(--f-sans);color:var(--ink);background-color:var(--paper);background-image:var(--bg-grad);
  background-attachment:fixed;min-height:100vh;padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--top);z-index:10;background:var(--paper)}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--indigo-bright);outline-offset:2px;border-radius:6px}
svg.ic{flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.14em;font-size:10.5px}
.bk{--bkt:color-mix(in srgb,var(--bk) var(--bk-mix),white);--bkf:color-mix(in srgb,var(--bk) var(--bk-fill),white)}
.wrap{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.mid{max-width:1376px;margin-inline:auto}

/* ── the site's own bar, static ─────────────────────────────────────────── */
.site{border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--card) 55%,transparent)}
.site-in{display:flex;align-items:center;gap:36px;height:60px}
.brand{line-height:1}
.brand b{font:800 23px/1 var(--f-sans);letter-spacing:-.02em;color:var(--ink)}
.brand b i{font-style:normal;color:var(--zh)}
.brand span{display:block;margin-top:5px;font:400 9.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-quiet)}
.site nav{display:flex;gap:30px;align-items:center}
.site nav.r{margin-left:auto}
.site nav a{display:flex;gap:8px;align-items:center;font:500 12px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-soft);text-decoration:none;padding:8px 0;border-bottom:1.5px solid transparent}
.site nav a.on{color:var(--indigo);border-bottom-color:var(--indigo)}

/* ── page head ──────────────────────────────────────────────────────────── */
.eyebrow{font:500 11.5px/1 var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--indigo)}
.ph h1{font:700 44px/1.05 var(--f-sans);letter-spacing:-.015em;margin-top:14px}
.ph .lede{font:400 17.5px/1.45 var(--f-serif);color:var(--ink-soft);margin-top:14px;max-width:38em}
.ph .lede::after{content:"";display:block;width:150px;height:2px;margin-top:16px;border-radius:2px;
  background:linear-gradient(90deg,var(--indigo-bright),transparent)}
.ph.slim{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.ph.slim h1{font-size:32px;margin-top:8px}
.ph.slim .lede{font-size:15.5px;margin:0 0 3px;flex:1 1 300px;min-width:0}
.ph.slim .lede::after{display:none}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:24px 40px;flex-wrap:wrap}

/* ── toolbar ────────────────────────────────────────────────────────────── */
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.tb .search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;flex:1 1 220px;min-width:160px;max-width:420px;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;color:var(--ink-quiet)}
.tb .search:focus-within{border-color:var(--indigo-bright);box-shadow:0 0 0 3px color-mix(in srgb,var(--indigo-bright) 18%,transparent)}
.tb input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;color:var(--ink)}
.tb input::placeholder{color:var(--ink-quiet)}
.tb input::-webkit-search-cancel-button{display:none}
.tb .count{font:400 12.5px/1 var(--f-mono);color:var(--ink-quiet);white-space:nowrap;min-width:9.2em}
.tb .lbl{font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-quiet)}
.tb select,.tb .dir,.tb .help{height:40px;border:1px solid var(--rule);border-radius:12px;background:var(--card)}
.tb select{padding:0 30px 0 12px;font-size:14.5px;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-quiet) 50%),linear-gradient(135deg,var(--ink-quiet) 50%,transparent 50%);
  background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.tb .dir{display:flex;align-items:center;gap:8px;padding:0 13px;font:400 12px/1 var(--f-mono);color:var(--ink-soft);white-space:nowrap}
.tb .help{width:40px;font:600 17px/1 var(--f-sans);color:var(--ink-soft)}
.tb select:hover,.tb .dir:hover,.tb .help:hover{border-color:var(--ink-faint)}
.helpbox{position:absolute;right:0;top:48px;z-index:40;width:min(360px,calc(100vw - 32px));padding:16px 18px;background:var(--card);
  border:1px solid var(--rule);border-radius:16px;box-shadow:var(--pop);font:400 14.5px/1.55 var(--f-serif);color:var(--ink-soft)}
.helpbox b{font:700 14px var(--f-sans);color:var(--ink);display:block;margin-bottom:6px}
.helpbox p+p{margin-top:8px}

/* ── shared pieces ──────────────────────────────────────────────────────── */
.au{font:600 10.5px/1.35 var(--f-mono);letter-spacing:.15em;text-transform:uppercase;color:var(--bkt)}
.wr{font:italic 400 13.5px/1.35 var(--f-serif);color:var(--ink-soft)}
.meta{font:400 10.5px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-quiet)}
.orig{display:inline-block;font:600 11px/1 var(--f-sans);padding:4px 9px 4px;border-radius:999px;white-space:nowrap;color:var(--ink-soft);
  border:1px solid color-mix(in srgb,var(--bkt) 50%,transparent);background:color-mix(in srgb,var(--bkt) 9%,var(--card))}
.st{font:600 13px/1.3 var(--f-sans);white-space:nowrap}
.st-new{color:var(--ink-soft)}
.st-on{color:var(--indigo)}
.st-done{color:var(--good);display:inline-flex;gap:5px;align-items:center}
.pg{display:block;height:4px;border-radius:4px;background:var(--rule);overflow:hidden}
.pg i{display:block;height:100%;border-radius:4px;background:var(--bkf)}
.pg.done i{background:var(--good)}
.sb{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink-faint);flex:none}
.sb:hover{color:var(--ochre);background:color-mix(in srgb,var(--ochre) 12%,transparent)}
.sb.on{color:var(--ochre)}
.sb.on svg{fill:currentColor}
.sb.shy{opacity:0}
.bk:hover .sb.shy,.bk:focus-within .sb.shy,.sb.shy.on,.sb.shy:focus-visible{opacity:1}
@media (hover:none){.sb.shy{opacity:1}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:999px;
  font:700 14.5px/1 var(--f-sans);background:var(--indigo);color:var(--card);white-space:nowrap}
.btn:hover{background:var(--indigo-bright)}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.btn.line{background:none;color:var(--indigo);border:1px solid color-mix(in srgb,var(--indigo) 45%,transparent)}
.btn.line:hover{background:var(--indigo-wash)}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;font:600 13px/1 var(--f-sans);color:var(--ink-soft)}
.tbtn:hover{background:var(--paper-2);color:var(--ink)}
.tbtn.on{color:var(--ochre)} .tbtn.on svg{fill:currentColor}
.grp-h{display:flex;align-items:center;gap:12px;font:500 11px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-quiet)}
.grp-h::after{content:"";flex:1;height:1px;background:var(--rule)}
.grp-h em{font-style:normal;letter-spacing:.08em;color:var(--ink-faint)}
.none{padding:56px 20px;text-align:center;font:400 17px/1.5 var(--f-serif);color:var(--ink-soft)}
.none button{color:var(--indigo);text-decoration:underline;text-underline-offset:3px}
.is-sel{--sel:1}
.menu{position:fixed;z-index:90;min-width:190px;padding:6px;background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--pop)}
.menu b{display:block;padding:8px 10px 6px;font:700 13px/1.25 var(--f-sans);max-width:240px}
.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;font:600 14px/1 var(--f-sans);color:var(--ink-soft);text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--indigo-wash);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 18px);transform:translateX(-50%);z-index:95;max-width:min(560px,calc(100vw - 32px));
  padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--paper);font:600 13.5px/1.35 var(--f-sans);box-shadow:var(--pop);text-align:center}
.tip{position:fixed;z-index:80;pointer-events:none;padding:8px 11px;border-radius:10px;background:var(--ink);color:var(--paper);
  font:600 12.5px/1.3 var(--f-sans);max-width:280px;box-shadow:var(--pop)}
.tip small{display:block;margin-top:2px;font:italic 400 12px/1.3 var(--f-serif);opacity:.85}

/* ── 1 · Reading room ───────────────────────────────────────────────────── */
.d1{display:grid;grid-template-columns:232px minmax(0,1fr) 384px;gap:32px;padding-block:30px 48px;align-items:start}
.d1-rail,.d1-det{position:sticky;top:calc(var(--top) + 18px);max-height:calc(100vh - var(--bar-h) - 36px);overflow:auto;scrollbar-width:thin}
.d1-rail{padding-right:6px}
.d1-rail h2{display:flex;justify-content:space-between;align-items:center;font:500 10.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-quiet);padding:16px 0 8px;border-top:1px solid var(--rule);margin-top:12px}
.d1-rail section:first-of-type h2{border-top:0;margin-top:0;padding-top:4px}
.d1-rail .clr{font:600 12px/1 var(--f-sans);letter-spacing:0;text-transform:none;color:var(--indigo)}
.fo{display:flex;width:100%;align-items:center;gap:9px;padding:4.5px 6px;margin-left:-6px;border-radius:8px;font:400 13.5px/1.3 var(--f-sans);color:var(--ink-soft);text-align:left}
.fo:hover{background:color-mix(in srgb,var(--card) 70%,transparent);color:var(--ink)}
.fo i{flex:none;width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink-faint);display:grid;place-items:center;color:var(--card)}
.fo span{flex:1;min-width:0}
.fo em{font:400 11px/1 var(--f-mono);color:var(--ink-quiet);font-style:normal}
.fo.on{color:var(--ink);font-weight:700}
.fo.on i{background:var(--indigo);border-color:var(--indigo)}
.fo.zero{opacity:.45}
.d1-main .ph{margin-bottom:22px}
.d1-main .tb{margin-bottom:14px;flex-wrap:nowrap}
.d1-main .tb .lbl{display:none}
.d1-main .tb .count{min-width:0}
.d1-main .tb .search{flex:1 1 120px;min-width:110px}
.d1-list{background:var(--card);border:1px solid var(--rule);border-radius:18px;overflow:hidden}
.d1-gh{padding:9px 18px;background:color-mix(in srgb,var(--paper-2) 55%,var(--card));border-bottom:1px solid var(--rule);
  font:500 10.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-quiet)}
.r1+.d1-gh{border-top:1px solid var(--rule)}
.r1{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:4px 16px;align-items:center;padding:11px 10px 11px 20px;cursor:pointer}
.r1+.r1{border-top:1px solid var(--rule)}
.r1::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--bkf)}
.r1:hover{background:color-mix(in srgb,var(--paper) 70%,var(--card))}
.r1.is-sel{background:var(--indigo-wash)}
.r1.is-sel::before{top:0;bottom:0;width:5px;border-radius:0}
.r1-t{font:700 15.5px/1.3 var(--f-sans);letter-spacing:-.005em}
.r1-s{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;margin-top:3px}
.r1-b{text-align:right;display:grid;gap:5px;justify-items:end}
.r1-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.r1-on{display:flex;gap:9px;align-items:center}
.r1-on .pg{width:52px}
.d1-det{background:var(--card);border:1px solid var(--rule);border-radius:20px;box-shadow:var(--lift)}
.det-top{padding:22px 24px 20px;border-top:6px solid var(--bkf);border-radius:20px 20px 0 0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bkt) var(--wash),var(--card)),var(--card))}
.det-top .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.det-top .au{font-size:11px;padding-top:8px}
.det-top h2{font:700 27px/1.14 var(--f-sans);letter-spacing:-.012em;margin-top:10px;text-wrap:balance}
.det-top .sub{font:italic 400 15px/1.4 var(--f-serif);color:var(--ink-soft);margin-top:8px}
.det-facts{padding:4px 24px 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px}
.det-facts dt,.det-facts dd{padding:9px 0;border-top:1px solid var(--rule)}
.det-facts dt{font:500 10.5px/1.6 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-quiet)}
.det-facts dd{font:400 14.5px/1.4 var(--f-sans);color:var(--ink)}
.det-facts dd.s{font-family:var(--f-serif);font-style:italic}
.det-place{margin:6px 24px 0;padding:16px 0 0;border-top:1px solid var(--rule)}
.det-place .l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.det-place .l small{font:italic 400 13px/1 var(--f-serif);color:var(--ink-quiet)}
.det-place .pg{height:6px}
.det-go{padding:18px 24px 20px;display:grid;gap:10px}
.det-go .btn{height:48px;font-size:15.5px;background:var(--bkt);color:var(--card)}
.det-go .btn:hover{filter:brightness(1.1)}
.det-go .hint{font:400 11px/1.5 var(--f-mono);color:var(--ink-quiet);text-align:center}

/* ── 2 · Stacks ─────────────────────────────────────────────────────────── */
.d2{padding-block:34px 56px;--cols:7;--gap:22px}
.d2-band{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap);margin-top:30px}
.d2-zone{display:flex;flex-direction:column;gap:14px;grid-column:1/-1;min-width:0}
.d2-cont{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);flex:1}
.d2-wall{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:26px var(--gap)}
.d2-band.both .d2-zone.c{grid-column:span 4}
.d2-band.both .d2-zone.f{grid-column:span 3}
.d2-band.both .d2-cont{grid-template-columns:1fr 1fr}
.d2-band.both .d2-wall{grid-template-columns:repeat(3,minmax(0,1fr))}
.c2{display:grid;grid-template-columns:104px minmax(0,1fr);background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden;cursor:pointer;min-height:132px}
.c2:hover{box-shadow:var(--lift)}
.c2.is-sel{border-color:var(--indigo-bright)}
.c2-n{background:var(--bk);color:var(--cover-ink);padding:16px 14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px var(--cover-edge)}
.c2-n b{font:800 32px/1 var(--f-sans);letter-spacing:-.02em}
.c2-n b small{font:700 15px/1 var(--f-sans);margin-left:1px;opacity:.85}
.c2-n span{font:500 10px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.c2-b{padding:14px 16px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.c2-b h3{font:700 16.5px/1.22 var(--f-sans);letter-spacing:-.005em}
.c2-b .f{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.c2-b .f small{font:italic 400 12.5px/1.2 var(--f-serif);color:var(--ink-quiet)}
.d2-else{margin-top:40px}
.d2-sec{margin-top:6px}
.d2-sh{position:sticky;top:var(--top);z-index:6;display:flex;align-items:baseline;gap:14px;padding:14px 0 12px;margin-bottom:6px;
  background:var(--paper);border-bottom:1px solid var(--rule)}
.d2-sh h2{font:700 19px/1.1 var(--f-sans);letter-spacing:-.008em}
.d2-sh span{font:400 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-quiet)}
.d2-sh span.s{font:italic 400 13.5px/1 var(--f-serif);letter-spacing:0;text-transform:none;margin-left:auto}
.d2-sec .d2-wall{padding:14px 0 24px}
.cv{min-width:0;cursor:pointer;outline-offset:4px}
.cv-face{position:relative;aspect-ratio:2/3;border-radius:5px 9px 9px 5px;background:var(--bk);color:var(--cover-ink);overflow:hidden;
  padding:16px 14px 13px 22px;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px var(--cover-edge),0 1px 2px rgba(29,27,41,.16),0 6px 14px rgba(29,27,41,.12);transition:transform .18s ease,box-shadow .18s ease}
.cv-face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.06));border-right:1px solid rgba(255,255,255,.2)}
.cv:hover .cv-face,.cv:focus-within .cv-face{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--cover-edge),0 2px 4px rgba(29,27,41,.18),0 16px 28px rgba(29,27,41,.2)}
.cv.is-sel .cv-face{outline:2px solid var(--indigo-bright);outline-offset:3px}
.cv-au{font:500 9.5px/1.45 var(--f-mono);letter-spacing:.15em;text-transform:uppercase;opacity:.9;padding-right:18px}
.cv-rule{display:block;width:22px;height:2px;background:currentColor;opacity:.55;margin:11px 0 12px;flex:none}
.cv-t{font:700 19px/1.13 var(--f-sans);letter-spacing:-.012em;text-wrap:balance;overflow-wrap:break-word;hyphens:auto}
.cv-t.s1{font-size:23px;line-height:1.08} .cv-t.s3{font-size:16.5px} .cv-t.s4{font-size:14.5px;line-height:1.18}
.cv-sub{font:italic 400 11.5px/1.35 var(--f-serif);opacity:.86;margin-top:9px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cv-base{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.cv-or{font:600 9.5px/1 var(--f-sans);padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.5);white-space:nowrap}
.cv-wr{font:italic 400 12.5px/1.3 var(--f-serif);opacity:.95}
.cv-star{position:absolute;top:10px;right:9px;color:var(--cover-ink)}
.cv-star svg{fill:currentColor}
.cv-sheet{position:absolute;left:9px;right:0;bottom:0;padding:12px 12px 12px;background:var(--card);color:var(--ink);border-radius:12px 12px 0 0;
  display:grid;gap:9px;transform:translateY(102%);transition:transform .2s ease;box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.cv:hover .cv-sheet,.cv:focus-within .cv-sheet{transform:none}
.cv-sheet p{font:italic 400 12px/1.35 var(--f-serif);color:var(--ink-soft)}
.cv-sheet .btn{height:34px;font-size:13px;padding:0 10px}
.cv-sheet .acts{display:flex;justify-content:space-between;margin:-3px -4px -5px}
.cv-sheet .tbtn{height:28px;font-size:12px;padding:0 6px}
.cv-pg{height:3px;border-radius:3px;margin:9px 0 0;background:var(--rule);overflow:hidden}
.cv-pg.no{background:none}
.cv-pg i{display:block;height:100%;background:var(--bkf)}
.cv-pg.done i{background:var(--good)}
.cv-foot{padding-top:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:baseline}
.cv-foot .meta:first-child{grid-column:1/-1}
.cv-foot .st{font-size:12.5px}

/* ── 3 · Time river ─────────────────────────────────────────────────────── */
.d3{padding-block:22px 56px}
.rv{margin-top:18px;background:var(--card);border:1px solid var(--rule);border-radius:20px;overflow:hidden}
.rv-head{display:flex;align-items:center;gap:16px;padding:9px 18px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.rv-head .t{font:500 11px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.rv-head .n{font:italic 400 13.5px/1.3 var(--f-serif);color:var(--ink-quiet);flex:1 1 240px;min-width:0}
.rv-zoom{display:flex;align-items:center;gap:4px}
.rv-zoom button{height:30px;min-width:30px;padding:0 8px;border:1px solid var(--rule);border-radius:9px;display:grid;place-items:center;font:600 12px/1 var(--f-sans);color:var(--ink-soft)}
.rv-zoom button:hover:not(:disabled){border-color:var(--ink-faint);color:var(--ink)}
.rv-zoom button:disabled{opacity:.4;cursor:default}
.rv-zoom output{font:400 11.5px/1 var(--f-mono);color:var(--ink-quiet);min-width:46px;text-align:center}
.rv-body{display:grid;grid-template-columns:176px minmax(0,1fr)}
.rv-lanes{border-right:1px solid var(--rule);padding-top:26px}
.rv-lanes div{display:flex;align-items:center;gap:8px;padding:0 10px 0 18px;font:600 12px/1.2 var(--f-sans);color:var(--ink-soft);border-top:1px solid var(--rule)}
.rv-lanes div em{font:400 10.5px/1 var(--f-mono);color:var(--ink-quiet);font-style:normal;margin-left:auto}
.rv-sc{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;cursor:grab}
.rv-sc.drag{cursor:grabbing}
.rv-in{position:relative}
.rv-era{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule);overflow:clip}
.rv-era:nth-child(even){background:color-mix(in srgb,var(--paper-2) 38%,transparent)}
.rv-era:first-child{border-left:0}
.rv-era span{position:sticky;left:10px;display:inline-block;margin:8px 10px 0;font:500 10px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-quiet);white-space:nowrap}
.rv-lane{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.rv-tick{position:absolute;bottom:0;width:1px;height:6px;background:var(--ink-faint);opacity:.55}
.rv-tick.k{height:11px;opacity:1;background:var(--ink-quiet)}
.rv-ax{position:absolute;left:0;right:0;bottom:0;height:34px;border-top:1px solid var(--rule);background:var(--card)}
.rv-ax b{position:absolute;top:13px;transform:translateX(-50%);font:400 10.5px/1 var(--f-mono);color:var(--ink-quiet);white-space:nowrap}
.rv-ax b.l{transform:none} .rv-ax b.r{transform:translateX(-100%)}
.rv-ax .rv-tick{bottom:auto;top:0}
.rc{position:absolute;height:16px;display:flex;align-items:center;border-radius:4px;white-space:nowrap;font:600 11.5px/1 var(--f-sans);color:var(--ink);transition:opacity .15s}
.rc i{flex:none;width:10px;height:16px;border-radius:3px;background:var(--bkf)}
.rc span{padding:0 7px 0 6px}
.rc.lab{background:color-mix(in srgb,var(--bkt) 10%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bkt) 32%,transparent)}
.rc:hover{z-index:3}
.rc:hover i,.rc:focus-visible i{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--bkt)}
.rc.fav::after{content:"";position:absolute;left:3.5px;top:-4px;width:4px;height:4px;border-radius:50%;background:var(--ochre)}
.rc.on i{background:linear-gradient(0deg,var(--bkf) var(--p),color-mix(in srgb,var(--bkf) 35%,var(--card)) var(--p))}
.rc.dim{opacity:.16}
.rc.is-sel{z-index:4}
.rc.is-sel i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--indigo-bright)}
.rc.is-sel.lab{box-shadow:inset 0 0 0 1.5px var(--indigo-bright)}
.rv-key{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font:400 12px/1 var(--f-sans);color:var(--ink-quiet)}
.rv-key span{display:flex;gap:6px;align-items:center}
.rv-key i{width:9px;height:14px;border-radius:2.5px;background:var(--ink-faint);display:block}
.rv-key i.h{background:linear-gradient(0deg,var(--ink-faint) 45%,var(--rule) 45%)}
.rv-key i.s{width:5px;height:5px;border-radius:50%;background:var(--ochre)}
.pop{width:300px;padding:16px 16px 12px 22px;overflow:hidden}
.pop::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--bkf)}
.pop h3{font:700 18px/1.2 var(--f-sans);margin:5px 0 3px;letter-spacing:-.008em}
.pop .m{display:flex;gap:7px 10px;align-items:center;flex-wrap:wrap;margin-top:9px}
.pop .p{display:grid;gap:7px;margin-top:11px}
.pop .a{display:flex;gap:4px;align-items:center;margin-top:13px;padding-top:10px;border-top:1px solid var(--rule)}
.pop .a .btn{margin-right:auto;width:auto;color:var(--card);padding:0 14px}
.pop .a .btn:hover{background:var(--indigo-bright);color:var(--card)}
.pop .a .sb{display:inline-grid;width:28px;padding:0}
.d3-lh{margin:34px 0 14px}
.d3-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.d3-list+.d3-lh{margin-top:28px}
.b3{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;min-height:88px;padding:12px 12px 12px 22px;background:var(--card);
  border:1px solid var(--rule);border-radius:15px;cursor:pointer;overflow:hidden}
.b3::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--bkf)}
.b3:hover{box-shadow:var(--lift)}
.b3.is-sel{border-color:var(--indigo-bright);box-shadow:0 0 0 1px var(--indigo-bright)}
.b3 h3{font:600 17px/1.22 var(--f-sans);margin:3px 0 2px;letter-spacing:-.005em}
.b3-r{display:grid;justify-items:end;gap:6px;text-align:right}
.b3-r .top{display:flex;align-items:center;gap:4px;min-height:22px}
.b3-r .sb{width:22px;height:22px}

/* ── 4 · Catalogue ──────────────────────────────────────────────────────── */
.d4{padding-block:22px 56px}
.d4-cont{display:flex;gap:12px;align-items:stretch;margin:18px 0 16px}
.d4-cont>.l{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font:500 10.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-quiet);padding:0 2px}
.d4-cont>div{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.c4{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px 12px 20px;background:var(--card);border:1px solid var(--rule);border-radius:14px;cursor:pointer;overflow:hidden}
.c4::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--bkf)}
.c4:hover{box-shadow:var(--lift)}
.c4.is-sel{border-color:var(--indigo-bright)}
.c4 h3{font:700 15px/1.25 var(--f-sans)}
.c4 .au{font-size:9.5px}
.c4 .p{grid-column:1/-1;display:flex;gap:10px;align-items:center;margin-top:4px}
.c4 .p .pg{flex:1}
.d4-tw{background:var(--card);border:1px solid var(--rule);border-radius:16px}
.d4-t{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13.5px}
.d4-t th,.d4-t td{padding:0 10px;text-align:left;vertical-align:middle}
.d4-t thead th{position:sticky;top:var(--top);z-index:5;height:38px;background:var(--card);border-bottom:1px solid var(--rule);
  font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-quiet);white-space:nowrap}
.d4-t thead th:first-child{border-radius:16px 0 0 0} .d4-t thead th:last-child{border-radius:0 16px 0 0}
.d4-t thead button{display:inline-flex;align-items:center;gap:6px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;height:38px}
.d4-t thead button:hover{color:var(--ink)}
.d4-t thead th.on button{color:var(--indigo)}
.d4-t thead button svg{opacity:.35} .d4-t thead th.on button svg{opacity:1}
.d4-t tbody td{height:33px;border-top:1px solid color-mix(in srgb,var(--rule) 70%,transparent);line-height:1.25;padding-top:5px;padding-bottom:5px}
.d4-t tr.g th{height:30px;font:500 10.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-quiet);
  background:color-mix(in srgb,var(--paper-2) 50%,var(--card));border-top:1px solid var(--rule)}
.d4-t tbody tr.bk{cursor:pointer}
.d4-t tbody tr.bk:hover td{background:color-mix(in srgb,var(--paper) 75%,var(--card))}
.d4-t tbody tr.bk.is-sel td{background:var(--indigo-wash)}
.d4-t tbody tr.bk:focus-visible{outline:none}
.d4-t tbody tr.bk:focus-visible td{background:var(--indigo-wash);box-shadow:inset 0 1.5px 0 var(--indigo-bright),inset 0 -1.5px 0 var(--indigo-bright)}
.d4-t td.sp{padding:0;position:relative}
.d4-t td.sp::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:5px;border-radius:0 3px 3px 0;background:var(--bkf)}
.d4-t td.sr{padding:0 2px 0 8px}
.d4-t td.ti div{display:flex;gap:0 9px;align-items:baseline}
.d4-t td.ti div.s{flex-wrap:wrap;max-height:1.3em;overflow:hidden}
.d4-t td.ti div.s small{flex:1 0 96px}
.d4-t td.ti b{font:700 14.5px/1.25 var(--f-sans);min-width:0}
.d4-t td.ti small{flex:1 1 0;min-width:0;font:italic 400 12.5px/1.25 var(--f-serif);color:var(--ink-quiet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d4-t td.wri{font:italic 400 13.5px/1.25 var(--f-serif);color:var(--ink-soft)}
.d4-t td.len{font:400 12.5px/1.25 var(--f-sans);color:var(--ink-soft)}
.d4-t td.or .orig{font-size:10.5px;padding:3px 8px}
.d4-t td.or em{color:var(--ink-faint);font-style:normal}
.d4-t td.rd,.d4-t th.rd{text-align:right}
.d4-t td.rd{font:400 12px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.d4-t td.rd span{display:inline-block;vertical-align:middle;width:34px;height:4px;margin-right:9px;border-radius:3px;background:var(--rule);overflow:hidden}
.d4-t td.rd i{display:block;height:100%;background:var(--ink-faint)}
.d4-t td.pl .st{font-size:12.5px}
.d4-t td.pl .w{display:flex;align-items:center;gap:9px}
.d4-t td.pl .pg{width:54px;flex:none}
.d4-t td.mo{padding:0 6px 0 0;text-align:right}
.d4-t .au{font-size:10px;letter-spacing:.12em}
.d4-foot{padding:11px 16px;border-top:1px solid var(--rule);font:400 11px/1.4 var(--f-mono);color:var(--ink-quiet)}

/* ── 5 · Traditions ─────────────────────────────────────────────────────── */
.d5{padding-block:22px 18px}
.d5-ctl{display:flex;align-items:center;gap:10px 16px;margin:18px 0 12px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:color-mix(in srgb,var(--paper-2) 80%,transparent);border:1px solid var(--rule)}
.seg button{height:32px;padding:0 14px;border-radius:9px;font:600 13.5px/1 var(--f-sans);color:var(--ink-soft)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(29,27,41,.12)}
.d5-jump{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.d5-jump button{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--rule);background:color-mix(in srgb,var(--card) 70%,transparent);font:600 12.5px/1 var(--f-sans);color:var(--ink-soft);white-space:nowrap}
.d5-jump button em{font:400 10.5px/1 var(--f-mono);font-style:normal;color:var(--ink-quiet);margin-left:5px}
.d5-jump button{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.d5-jump button:hover{border-color:var(--ink-faint);color:var(--ink)}
.d5-jump button.zero{opacity:.45}
.d5-board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;align-items:start;height:560px;overflow:auto;
  border:1px solid var(--rule);border-radius:18px;background:color-mix(in srgb,var(--paper-2) 42%,var(--card));scrollbar-width:thin;overscroll-behavior-x:contain}
.d5-col{min-width:0;border-right:1px solid var(--rule);min-height:100%}
.d5-col.fav{position:sticky;left:0;z-index:4;align-self:stretch;background:color-mix(in srgb,var(--indigo-wash) 55%,var(--card));border-right:1px solid var(--rule);box-shadow:6px 0 14px -10px rgba(29,27,41,.35)}
.d5-ch{position:sticky;top:0;z-index:3;padding:13px 14px 11px;background:var(--card);border-bottom:1px solid var(--rule)}
.d5-col.fav .d5-ch{background:color-mix(in srgb,var(--indigo-wash) 55%,var(--card))}
.d5-ch h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 14.5px/1.2 var(--f-sans)}
.d5-ch h2 em{font:400 11px/1 var(--f-mono);font-style:normal;color:var(--ink-quiet)}
.d5-ch p{font:italic 400 12.5px/1.3 var(--f-serif);color:var(--ink-quiet);margin-top:3px}
.d5-cards{display:grid;gap:8px;padding:10px}
.d5-cards .e{font:italic 400 13px/1.4 var(--f-serif);color:var(--ink-quiet);padding:8px 4px}
.k5{position:relative;padding:9px 8px 9px 16px;background:var(--card);border:1px solid var(--rule);border-radius:12px;cursor:pointer;overflow:hidden;min-width:0}
.k5::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bkf)}
.k5:hover{border-color:var(--ink-faint)}
.k5.is-sel{border-color:var(--indigo-bright);box-shadow:0 0 0 1px var(--indigo-bright)}
.k5 .h{display:flex;justify-content:space-between;gap:4px;align-items:flex-start}
.k5 .au{font-size:9.5px;letter-spacing:.12em;padding-top:3px}
.k5 .sb{margin:-5px -3px -8px 0;width:24px;height:24px}
.k5 h3{font:700 14.5px/1.22 var(--f-sans);margin:3px 0 2px}
.k5 .wr{font-size:12.5px}
.k5 .f{display:grid;gap:3px;margin-top:8px}
.k5 .meta{font-size:9.5px;letter-spacing:.06em}
.k5 .st{font-size:12px}
.k5 .orig{font-size:10px;padding:3px 7px;margin-top:6px}
.k5 .pg{height:3px;margin-top:7px}

/* ── 6 · Desk ───────────────────────────────────────────────────────────── */
.d6{padding-block:34px 56px;max-width:1312px}
.d6-top{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:24px;margin-top:28px}
.hero{position:relative;padding:30px 34px 28px 42px;background:linear-gradient(115deg,var(--card) 46%,color-mix(in srgb,var(--bkt) calc(var(--wash) * 1.6),var(--card)));
  border:1px solid var(--rule);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--lift)}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--bkf)}
.hero .k{display:flex;gap:10px;align-items:center;font:500 10.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-quiet)}
.hero .k i{width:6px;height:6px;border-radius:50%;background:var(--good)}
.hero-g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 36px;align-items:end;margin-top:26px}
.hero .au{font-size:12px}
.hero h2{font:700 46px/1.04 var(--f-sans);letter-spacing:-.022em;margin-top:10px;text-wrap:balance}
.hero .sub{font:italic 400 17px/1.45 var(--f-serif);color:var(--ink-soft);margin-top:12px;max-width:34em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .facts{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;margin-top:16px}
.hero .big{text-align:right}
.hero .big b{font:800 76px/.9 var(--f-sans);letter-spacing:-.04em;color:var(--bkt);font-variant-numeric:tabular-nums}
.hero .big b small{font:700 30px/1 var(--f-sans);margin-left:2px}
.hero .big span{display:block;margin-top:8px;font:500 10.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-quiet)}
.strip{display:flex;gap:3px;margin-top:auto;padding-top:28px}
.strip i{flex:1;height:8px;border-radius:2px;background:var(--rule);min-width:1px}
.strip i.f{background:var(--bkf)} .strip i.h{background:color-mix(in srgb,var(--bkf) 45%,var(--rule))}
.strip.many{gap:1px}
.hero-f{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap}
.hero-f .w{font:600 15px/1.3 var(--f-sans)}
.hero-f .w small{font:italic 400 14px/1 var(--f-serif);color:var(--ink-quiet);margin-left:10px}
.hero-f .a{display:flex;gap:8px;align-items:center}
.hero-f .btn{height:48px;padding:0 26px;font-size:15.5px;background:var(--bkt)}

/* ── 3 · Time river ─────────────────────────────────────────────────────── */
/* The axis is piecewise: each pair of knots is linear, and the pairs are given room by how crowded the shelf is

const KNOTS = [[-2600, 0], [-800, .10], [-500, .16], [-300, .305], [1, .39], [500, .52], [1000, .585], [1500, .71], [1700, .83], [1800, .91], [1950, 1]];

  const PITCH = 18, PADV = 5, TOP = 26, MK = 10;
  let y = TOP, lanes = "", chips = "", labels = "";

    const items = BOOKS.filter(b => b.tradition === t).sort((a, b) => a.year - b.year || a.title.localeCompare(b.title));
    const endL = [-1e9, -1e9, -1e9], endM = [-1e9, -1e9, -1e9], rows = [[], [], []];
    items.forEach(b => {
      let x = X(b.year), r = -1; const wl = MK + 14 + textW(b.title);
      for (let i = 0; i < 2 && r < 0; i++) if (x >= endL[i] + 6 && x + wl <= W - 4) r = i;
      for (let i = 0; i < 3 && r < 0; i++) if (x >= endM[i] + 3) r = i;
      if (r < 0) { r = endM.indexOf(Math.min(...endM)); x = endM[r] + 3; }   // a crowd: set it beside its neighbour, a few pixels late
      rows[r].push({ b, x, wl }); endM[r] = x + MK; endL[r] = Math.max(endL[r], x + wl);
    });

    }));

      if (rest.length && S.favs.size) h += `<div class="grp-h d6-else">Everything else <em>${rest.length} texts, by form</em></div>`;
      h += FORMS.map(f => { const l = rest.filter(x => x.form === f); return l.length ? shelfRow(f, f, l, per) : ""; }).join("");
    }
    $("#fill").innerHTML = h; sync(list.length);
  }
};
const VIEW = [D1, D2, D3, D4, D5, D6];

/* ── mounting, selection, actions ───────────────────────────────────────── */
function mount() {

  $("#mk-note").innerHTML = `<b>${DESIGNS[S.d - 1][0]}.</b> ${DESIGNS[S.d - 1][1]}`;
  window.scrollTo(0, 0);
}
function refresh() { VIEW[S.d - 1].fill(); }
function markSel() { $$("#stage [data-b]").forEach(e => e.classList.toggle("is-sel", e.dataset.b === S.sel)); }
function select(id) { S.sel = id; markSel(); const v = VIEW[S.d - 1]; if (v.onSelect) v.onSelect(id); }
function toggleStar(id) { S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); refresh(); toast(S.favs.has(id) ? `Starred “${byId[id].title}”` : `Removed “${byId[id].title}” from Favourites`); }
function share(id) {

  const done = ok => toast(ok ? `Link to “${b.title}” copied` : link);
  try { navigator.clipboard.writeText(link).then(() => done(true), () => done(false)); } catch (e) { done(false); }
}
function go(id) { const b = byId[id], s = stateOf(b); toast(`Mockup only: the reader would open “${b.title}”${s === "on" ? " at " + b.word + " " + b.at.ch : ""}.`); }
let toastT; function toast(m) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
let menuAt = 0;
function closeMenu() { const m = $(".menu"); if (m) m.remove(); }
function openMenu(id, x, y) {

  m.innerHTML = `<b>${esc(b.title)}</b><button type="button" role="menuitem" data-go="${id}">${ic("go", 16)}${goLabel(b)}</button><button type="button" role="menuitem" data-star="${id}">${ic("star", 16)}${isFav(b) ? "Remove star" : "Star"}</button><button type="button" role="menuitem" data-share="${id}">${ic("share", 16)}Share</button>`;
  document.body.appendChild(m); const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + "px"; m.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 70)) + "px"; m.querySelector("button").focus();
}

/* the river's chip opens a small card beside it: the same facts and actions a banner carries */
function openPop(id, chip) {
  closeMenu(); const b = byId[id], m = document.createElement("div"); m.className = "menu pop bk"; m.style.setProperty("--bk", b.color); m.setAttribute("role", "dialog"); m.setAttribute("aria-label", b.title);
  m.innerHTML = `<span class="au">${esc(b.author)}</span><h3>${esc(b.title)}</h3><span class="wr">${esc(b.written)}</span>
    <div class="m"><span class="meta">${esc(b.len)} · ${reads(b)}</span>${orig(b)}</div>${b.at ? `<div class="p">${st(b)}${pg(b)}</div>` : ""}
    <div class="a"><button type="button" class="btn sm" data-go="${id}">${goLabel(b)}</button>${star(b)}<button type="button" class="sb" data-share="${id}" aria-label="Share" title="Share">${ic("share", 16)}</button></div>`;
  const tip = $(".tip"); if (tip) tip.hidden = true; menuAt = performance.now();
  document.body.appendChild(m); const r = chip.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight, low = innerHeight - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bar-h")) || 60);
  m.style.left = Math.max(8, Math.min(r.left - 8, innerWidth - w - 12)) + "px"; m.style.top = (r.bottom + 8 + h < low ? r.bottom + 8 : Math.max(8, r.top - h - 8)) + "px";

/* ── theme, hash, storage ───────────────────────────────────────────────── */
const sysDark = () => { try { return matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; } };
const themeNow = () => S.theme || (sysDark() ? "night" : "day");
function applyTheme() {
  const r = document.documentElement; if (S.theme) r.setAttribute("data-theme", S.theme === "night" ? "dark" : "light"); else r.removeAttribute("data-theme");
  $("#th-day").classList.toggle("on", themeNow() === "day"); $("#th-night").classList.toggle("on", themeNow() === "night");
  $("#th-day").setAttribute("aria-pressed", themeNow() === "day"); $("#th-night").setAttribute("aria-pressed", themeNow() === "night");
}
function save() {
  const h = "#" + S.d + (S.theme ? "-" + S.theme : "");
  try { if (location.hash !== h) history.replaceState(null, "", h); } catch (e) { try { location.hash = h; } catch (e2) {} }
  try { localStorage.setItem("folio-library-mockup", JSON.stringify({ d: S.d, theme: S.theme })); } catch (e) {}
}
function readHash() { const m = /^#([1-6])(?:-(day|night))?$/.exec(location.hash || ""); if (!m) return false; S.d = +m[1]; if (m[2]) S.theme = m[2]; return true; }
function setDesign(n) { n = ((n - 1 + 6) % 6) + 1; if (n === S.d) return; S.d = n; mount(); save(); }
function setTheme(t) { S.theme = t; applyTheme(); save(); }

/* ── events ─────────────────────────────────────────────────────────────── */
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; refresh(); } });
document.addEventListener("change", e => { if (e.target.id === "sort") { S.sort = e.target.value; S.rev = false; refresh(); } });
document.addEventListener("click", e => {
  const t = e.target, c = s => t.closest(s);
  let el;
  if (!c(".menu")) closeMenu();
  if (c("[data-noop]")) { e.preventDefault(); return; }
  if (!c("#help") && !c("#helpbox")) { const hb = $("#helpbox"); if (hb && !hb.hidden) { hb.hidden = true; $("#help").setAttribute("aria-expanded", "false"); } }
  if ((el = c("#mk-tabs button"))) return setDesign(+el.dataset.d);
  if ((el = c("[data-theme-set]"))) return setTheme(el.dataset.themeSet);
  if (c("#help")) { const hb = $("#helpbox"); hb.hidden = !hb.hidden; $("#help").setAttribute("aria-expanded", String(!hb.hidden)); return; }
  if (c("#dir")) { S.rev = !S.rev; return refresh(); }
  if ((el = c("[data-star]"))) { closeMenu(); return toggleStar(el.dataset.star); }
  if ((el = c("[data-share]"))) { closeMenu(); return share(el.dataset.share); }
  if ((el = c("[data-go]"))) { closeMenu(); select(el.dataset.go); return go(el.dataset.go); }
  if ((el = c("[data-more]"))) { const r = el.getBoundingClientRect(); return openMenu(el.dataset.more, r.right - 190, r.bottom + 4); }
  if (c("[data-clear]")) { S.q = ""; FACETS.forEach(F => S.f[F.k].clear()); return refresh(); }
  if (c("[data-clearf]")) { FACETS.forEach(F => S.f[F.k].clear()); return refresh(); }
  if ((el = c("[data-f]"))) { const set = S.f[el.dataset.f]; set.has(el.dataset.v) ? set.delete(el.dataset.v) : set.add(el.dataset.v); return refresh(); }
  if ((el = c("[data-th]"))) { if (S.sort === el.dataset.th) S.rev = !S.rev; else { S.sort = el.dataset.th; S.rev = false; } return refresh(); }
  if ((el = c("[data-grp]"))) { S.grp = el.dataset.grp; $("#board").scrollLeft = 0; return refresh(); }
  if ((el = c("[data-jump]"))) { const col = $$("#board .d5-col").find(x => x.dataset.col === el.dataset.jump), fav = $("#board .d5-col.fav"); if (col) $("#board").scrollTo({ left: col.offsetLeft - (fav ? fav.offsetWidth : 0), behavior: "smooth" }); return; }
  if ((el = c("[data-shelf]"))) { const k = el.dataset.shelf; S.open.has(k) ? S.open.delete(k) : S.open.add(k); return refresh(); }
  if (c("#zin") || c("#zout") || c("#zfit")) { const i = ZOOMS.indexOf(S.zoom); S.zoom = c("#zfit") ? 1 : ZOOMS[Math.max(0, Math.min(ZOOMS.length - 1, i + (c("#zin") ? 1 : -1)))]; return riverLayout(); }
  if ((el = c("[data-b]"))) { if (panned) return; select(el.dataset.b); if (el.classList.contains("rc")) openPop(el.dataset.b, el); }
});
document.addEventListener("scroll", e => { if (performance.now() - menuAt > 250 && !(e.target.closest && e.target.closest(".menu"))) closeMenu(); }, true);
document.addEventListener("contextmenu", e => { const el = e.target.closest("[data-b]"); if (el) { e.preventDefault(); select(el.dataset.b); openMenu(el.dataset.b, e.clientX, e.clientY); } });
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase(), typing = tag === "input" || tag === "select" || tag === "textarea";
  if (e.key === "Escape") { closeMenu(); const hb = $("#helpbox"); if (hb) hb.hidden = true; if (typing && e.target.id === "q" && S.q) { S.q = ""; refresh(); } return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-6]$/.test(e.key)) { e.preventDefault(); return setDesign(+e.key); }
  if (e.key === "d" || e.key === "D") return setTheme(themeNow() === "night" ? "day" : "night");
  const sideways = e.target.closest && e.target.closest("#rv-sc,#board");
  if (e.key === "ArrowRight" && !sideways) return setDesign(S.d + 1);
  if (e.key === "ArrowLeft" && !sideways) return setDesign(S.d - 1);
  const v = VIEW[S.d - 1]; if (v.keys && v.keys(e)) { e.preventDefault(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-b]:not(button)")) { e.preventDefault(); if (e.key === "Enter" && S.sel === e.target.dataset.b) go(S.sel); else select(e.target.dataset.b); }
  if (e.key === "/") { const q = $("#q"); if (q) { e.preventDefault(); q.focus(); } }
});
/* hover: the reading room previews a row in its detail pane; the river names a chip */
let peekT;

  if (chip && !$(".menu")) { const b = byId[chip.dataset.b]; if (!tip) { tip = document.createElement("div"); tip.className = "tip"; document.body.appendChild(tip); }
    tip.innerHTML = `${esc(b.title)}<small>${esc(b.author)} · ${esc(b.written)}</small>`; tip.hidden = false;
    const r = chip.getBoundingClientRect(), w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px"; tip.style.top = (r.top - tip.offsetHeight - 8) + "px";
  } else if (tip) tip.hidden = true;
  if (S.d !== 1) return;

  clearTimeout(peekT);

  else if (!inDet) peekT = setTimeout(() => D1.detail(D1.shown), 320);

/* drag the river sideways */
let panned = false;
document.addEventListener("pointerdown", e => {
  const sc = e.target.closest("#rv-sc"); if (!sc || e.button !== 0 || e.pointerType === "touch") return;
  const x0 = e.clientX, s0 = sc.scrollLeft; panned = false;

});
let rsT; addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { const v = VIEW[S.d - 1]; if (v.resize) v.resize(); if (S.d === 6) refresh(); }, 120); });
addEventListener("hashchange", () => { const d = S.d; if (readHash()) { applyTheme(); if (d !== S.d) mount(); } });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch (e) {}

/* ── start ──────────────────────────────────────────────────────────────── */
$("#mk-tabs").innerHTML = DESIGNS.map((d, i) => `<button type="button" role="tab" data-d="${i + 1}" title="${d[0]}"><kbd>${i + 1}</kbd><span>${d[0]}</span></button>`).join("");
try { const o = JSON.parse(localStorage.getItem("folio-library-mockup") || "null"); if (o && o.d >= 1 && o.d <= 6) { S.d = o.d; S.theme = o.theme === "day" || o.theme === "night" ? o.theme : null; } } catch (e) {}
readHash();
S.sel = sorted(BOOKS)[0].id;
applyTheme(); mount();
try { new ResizeObserver(() => { document.documentElement.style.setProperty("--bar-h", $("#mock").offsetHeight + "px"); if (S.d === 5) D5.resize(); }).observe($("#mock")); } catch (e) {}
try { document.fonts.ready.then(() => { const v = VIEW[S.d - 1]; if (v.resize) v.resize(); }); } catch (e) {}
