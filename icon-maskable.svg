<!-- Maskable variant: the seal sits inside the 40% safe zone, so Android can crop this to any
     mask shape (circle, squircle, rounded square) without clipping the mark. Full-bleed paper. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Folio">
  <rect width="512" height="512" fill="#F6F5F1"/>
  <circle cx="256" cy="256" r="82" fill="#C8453C"/>
</svg>
