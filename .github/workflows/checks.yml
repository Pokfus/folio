name: checks

# WHY THIS EXISTS. Folio has 48 regression suites and every one of them was written
# because the failure it guards is SILENT -- a wrong interval is still a number on a
# button, a deck row hidden by an ad blocker still renders, a stripped rating still
# parses. Suites like that are worth exactly as much as the discipline of running them,
# and they were run by hand.
#
# Two jobs, deliberately split:
#
#   fast   -- the eight suites and four checkers that need no browser. Seconds, no
#             install, no network. This is the gate: it must stay green.
#   browser-- the Playwright suites. Slower and heavier, so it is allowed to be the
#             second opinion rather than the gate.
#
# Playwright is installed HERE and never into the repo: the zero-dependency rule is
# about what the SITE ships, and node_modules/ is gitignored. Nothing in this workflow
# adds a dependency to Folio itself.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: no-browser suites and checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cheapest possible failure first: a syntax error in app.js breaks every page,
      # and `node --check` finds it before a browser is even considered.
      - name: Syntax-check the site's JS
        run: |
          for f in *.js; do node --check "$f" || exit 1; done
          echo "all root .js files parse"

      - name: Syntax-check the helper scripts
        run: |
          for f in .claude/*.js; do node --check "$f" || exit 1; done
          echo "all .claude/*.js parse"

      # The suites that need no browser. Each exits non-zero on failure.
      - name: test-card-plans
        run: node .claude/test-card-plans.js
      - name: test-daily-quote
        run: node .claude/test-daily-quote.js
      - name: test-date-line
        run: node .claude/test-date-line.js
      - name: test-difficulty
        run: node .claude/test-difficulty.js
      - name: test-discovery
        run: node .claude/test-discovery.js
      - name: test-scheduler
        run: node .claude/test-scheduler.js
      - name: test-streak-chest
        run: node .claude/test-streak-chest.js
      - name: test-tense-notes
        run: node .claude/test-tense-notes.js
      # test-learning is half no-browser: FOLIO_SKIP_BROWSER runs sections 1-5 here, in seconds,
      # and the browser job below picks the same file up again for the rest. The cheap half is
      # worth gating on -- it holds the relearning criterion's arithmetic, the answer matcher, and
      # the static checks that the pretest never writes a card record.
      - name: test-learning (no-browser half)
        env:
          FOLIO_SKIP_BROWSER: "1"
        run: node .claude/test-learning.js

      # The content checkers. check-style and check-questions guard the house rules over
      # the shipped corpus; check-docs guards the CLAUDE.md/docs split in both directions.
      - name: check-docs
        run: node .claude/check-docs.js
      # The glossary's citations and illustrations live in the lazy glossary-extra.js. If either
      # table ever reappears in glossary.js it goes straight back onto the eager path -- 1.29 MB
      # for every visitor -- and the only symptom is a slower site.
      - name: glossary split intact
        run: node .claude/split-glossary.js --check
      # …and the artefacts' descriptions, citations and pictures live in the lazy artefacts-extra.js,
      # which were 94% of artefacts.js. Same failure and same lack of a symptom; --check also asserts
      # the join holds in both directions, since a row nothing indexes is content no reader can reach.
      - name: artefact split intact
        run: node .claude/split-artefacts.js --check
      - name: check-questions
        run: node .claude/check-questions.js
      - name: check-style
        run: node .claude/check-style.js

      # THE SIZE GOES IN THE JOB SUMMARY, NOT ONLY IN THE LOG (Sep 2026). It ran here with
      # continue-on-error from the start, which is right -- a size is not a failure -- and
      # NOBODY READS A GREEN JOB'S LOG. The eager path grew 2.6x past the largest figure
      # written down anywhere without one person noticing, which is exactly what a threshold
      # is for. So: the gzipped total is written to $GITHUB_STEP_SUMMARY, where it is on the
      # run's own front page, and the step FAILS above EAGER_GZ_MAX_KB.
      #
      # The ceiling is deliberately generous rather than tight. It is not a budget to be held
      # to the byte: it is a tripwire against the class of change that doubles the path in one
      # commit -- a data file put on the eager list, a translation table re-added. Raise it
      # DELIBERATELY, in the commit that spends it, and say in the message what was bought.
      - name: eager path size
        env:
          EAGER_GZ_MAX_KB: "3200"
        run: |
          node .claude/check-sizes.js | tee /tmp/sizes.txt
          gz=$(node .claude/check-sizes.js --json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              console.log(Math.round((JSON.parse(s).eagerGz || 0) / 1024));
            });
          ')
          {
            echo "### Eager load path"
            echo ""
            echo "**${gz} KB gzipped** (ceiling ${EAGER_GZ_MAX_KB} KB)"
            echo ""
            echo '```'
            head -40 /tmp/sizes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$gz" -gt "$EAGER_GZ_MAX_KB" ]; then
            echo "::error::the eager path is ${gz} KB gzipped, past the ${EAGER_GZ_MAX_KB} KB ceiling"
            exit 1
          fi
          echo "eager path ${gz} KB gzipped, within ${EAGER_GZ_MAX_KB} KB"

      # THE CARD-LEVEL FINDINGS AS A TREND, NOT A GATE (Sep 2026). check-cards.js reports a
      # large standing backlog -- one card in seven rests three or more citations on a single
      # author, and the substitutes for the worst of it are not reachable from this sandbox --
      # so gating on it would block every commit, and that is why it has always been a tool run
      # by hand. But a backlog is a number that can only be read as a DIRECTION, and read once
      # a month it tells you nothing about the day it moved. Written into the summary on every
      # push, a regression is visible the day it lands.
      - name: card findings (report only)
        run: |
          node .claude/check-cards.js --report | tee /tmp/cards.txt || true
          {
            echo "### Card findings"
            echo ""
            echo '```'
            tail -25 /tmp/cards.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

  browser:
    name: Playwright suites
    runs-on: ubuntu-latest
    # A slow second opinion, not the gate. If the fast job is red the answer is already
    # known, so don't spend ten minutes confirming it.
    needs: fast
    # AND THE JOB IS WRITTEN THE WAY THE PARAGRAPH ABOVE DESCRIBES IT (Aug 2026, on request).
    # It said "not the gate" and then exited 1, which fails the RUN -- so every push mailed a
    # failure, and with three content branches pushing every ten minutes that is a mailbox
    # rather than a signal. The job still runs and a red suite is still red in the run's job
    # list; what changes is that it no longer speaks for the whole run, which is what `fast`
    # is for. Do NOT put this on the steps: `continue-on-error` there makes the JOB green too,
    # which hides the failure instead of declassifying it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installed into a scratch directory OUTSIDE the repo, and reached through
      # NODE_PATH -- exactly as CLAUDE.md's Testing section says to do it locally, so
      # CI and a developer's machine run the suites the same way.
      - name: Install Playwright (outside the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@latest >/dev/null
          npx playwright install --with-deps chromium

      - name: Run the browser suites
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          fails=0
          for f in $(grep -l playwright .claude/test-*.js | sort); do
            echo "::group::$(basename "$f")"
            if node "$f"; then echo "PASS $(basename "$f")"
            else echo "FAIL $(basename "$f")"; fails=$((fails+1)); fi
            echo "::endgroup::"
          done
          echo "----"
          if [ "$fails" -gt 0 ]; then echo "$fails browser suite(s) failed"; exit 1; fi
          echo "all browser suites passed"
