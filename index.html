<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- The home page's values are the static baseline; app.js's setPageMeta() keeps title/description/OG
       in step with the current hash route (most link-preview crawlers don't run JS, so what they see
       is what's written here). Keep these matching PAGE_META.home in app.js. -->
  <title>Folio — a study companion</title>
  <meta name="description" content="Spaced-repetition flashcards for history, daily games and an interactive atlas." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Folio" />
  <meta property="og:title" content="Folio — a study companion" />
  <meta property="og:description" content="Spaced-repetition flashcards for history, daily games and an interactive atlas." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Folio — a study companion" />
  <meta name="twitter:description" content="Spaced-repetition flashcards for history, daily games and an interactive atlas." />
  <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161619" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!-- Fonts are imported in styles.css; preconnect speeds the handshake -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Inline SVG favicon: a vermilion seal on warm paper -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F6F5F1'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23C8453C'/%3E%3C/svg%3E" />

  <!-- PWA: installable, and offline once the service worker (registered by app.js) has run -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Folio" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============================================================
       TOP BAR — desktop only (hidden below 640px; see .topbar in styles.css)
       Left:  Home · Decks · Map · About
       Right: Editor/Visitor · Edit · Account · Settings
       Light/dark and the language picker used to live here too; both now sit on the
       Settings page, which is where a preference belongs and where a phone can reach
       them once the top bar is gone.
       ============================================================ -->
  <header class="topbar">
    <nav class="nav left" aria-label="Primary">
      <button class="tab" type="button" data-route="home">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.4 12 4l9 7.4"/><path d="M5.5 9.8V20h13V9.8"/></svg>
        <span class="tab-label">Home</span><span class="ink"></span>
      </button>
      <button class="tab" type="button" data-route="decks">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="tab-label">Library</span><span class="ink"></span>
      </button>
      <button class="tab" type="button" data-route="map">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="tab-label">Atlas</span><span class="ink"></span>
      </button>
      <button class="tab" type="button" data-route="mission">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span class="tab-label">About</span><span class="ink"></span>
      </button>
    </nav>

    <nav class="nav right" aria-label="Account">
      <button class="mode-switch" id="mode-switch" type="button" role="switch" aria-checked="true" title="Editor view — click to preview as a first-time visitor">
        <span class="ms-dot" aria-hidden="true"></span>
        <span class="ms-label" id="mode-label">Editor</span>
      </button>
      <button class="tab tab-admin" type="button" data-route="admin">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        <span class="tab-label">Edit</span><span class="ink"></span>
      </button>
      <button class="tab" type="button" data-route="account">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="tab-label">Account</span><span class="ink"></span>
      </button>
      <button class="tab" type="button" data-route="settings">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="tab-label">Settings</span><span class="ink"></span>
      </button>
    </nav>
  </header>

  <!-- ============================================================
       PAGE MOUNT
       app.js renders each page into #view as <div class="page">…</div>
       ============================================================ -->
  <main class="stage">
    <div id="view"></div>
  </main>

  <!-- ============================================================
       BOTTOM TAB BAR — phones only (see .tabbar in styles.css)
       Every destination the top bar carried, moved into the thumb's arc and named. On a
       390px screen the top bar held nine icon-only controls in a horizontally scrolling
       strip at the far end of the reach; with light/dark and the language picker moved
       to Settings, and Account / Settings / Edit moved down here, nothing is left up
       there at all and the top bar is hidden outright on phones.
       They share `.tab` + data-route, so setActiveTab and the boot-time route wiring
       cover them with no extra code.
       Edit is NOT among them: on a phone it is the top-right button on the home page
       (and on a study card, where it opens that card) — see showAdminEditBtn in app.js.
       It is one person's tool, and it was taking a seventh of a row six readers share.
       Neither is Library (Aug 2026, on request): it is reached from the home page's Library
       banner, under the review and the active decks it belongs beside — see .lib-banner.
       ============================================================ -->
  <nav class="tabbar" aria-label="Primary">
    <button class="tab" type="button" data-route="home">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.4 12 4l9 7.4"/><path d="M5.5 9.8V20h13V9.8"/></svg>
      <span class="tab-label">Home</span>
    </button>
    <button class="tab" type="button" data-route="map">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="tab-label">Atlas</span>
    </button>
    <button class="tab" type="button" data-route="mission">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span class="tab-label">About</span>
    </button>
    <button class="tab" type="button" data-route="account">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="tab-label">Account</span>
    </button>
    <button class="tab" type="button" data-route="settings">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="tab-label">Settings</span>
    </button>
  </nav>

  <noscript>
    <div style="max-width:560px;margin:80px auto;padding:0 24px;font-family:Georgia,serif;color:#1B1A17;text-align:center;">
      <h1 style="font-weight:600;">Folio needs JavaScript</h1>
      <p style="color:#4A4843;">This study companion runs entirely in your browser. Please enable JavaScript to load your decks.</p>
    </div>
  </noscript>

  <!-- ============================================================
       SCRIPTS

       Only the study-critical data ships here (~1.4 MB): the cards, the glossary, the
       minigame pools and the app itself. Everything else is LAZY — app.js's DATA_BUNDLES
       injects it on demand:

         bundle "world"      world.js                     — Atlas, home-page mini globe, Settings home picker
         bundle "atlas"      uk / lakes / rivers / water / cities / timeline /
                             countries / country-stats / country-spans / country-years
         bundle "uiI18n:<lang>"     i18n/ui-<lang>.js      — only when the site language isn't English
         bundle "glossI18n:<lang>"  i18n/gloss-<lang>.js   — ditto (one file per language, ~310 KB
                                                              for the language actually being read)

       That is ~9.9 MB a visitor no longer downloads to flip a card. Don't move a lazy file
       back into this list without also dropping it from DATA_BUNDLES — a bundle whose files
       are already present still works (the browser serves them from cache), but the eager
       download is exactly the cost this split exists to avoid.

       ranges.js + admin1.js (the removed Mountains / Divisions layers) are not loaded at
       all — app.js falls back to empty data.
       ============================================================ -->
  <script src="data.js"></script>
  <script src="truefalse.js"></script>
  <script src="quotes.js"></script>
  <script src="changelog.js"></script>
  <script src="mission.js"></script>
  <script src="glossary.js"></script>
  <script src="glossary-wikipedia.js"></script>
  <script src="app.js"></script>
</body>
</html>
